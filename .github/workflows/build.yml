name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MINGW_VERSION: '20261006'
  LLVM_MINGW_SHA256: 317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a
  WIX_RELEASE: wix3141rtm
  WIX_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: tools
          key: tools-${{ env.LLVM_MINGW_SHA256 }}-${{ env.WIX_SHA256 }}

      - name: Download llvm-mingw and WiX 3.14
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $mingw = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$mingw.zip" -OutFile tools\mingw.zip
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/$env:WIX_RELEASE/wix314-binaries.zip" -OutFile tools\wix.zip
          # Tools are used only if they match the pinned checksums.
          if((Get-FileHash tools\mingw.zip -Algorithm SHA256).Hash -ne $env:LLVM_MINGW_SHA256){throw 'llvm-mingw checksum mismatch'}
          if((Get-FileHash tools\wix.zip -Algorithm SHA256).Hash -ne $env:WIX_SHA256){throw 'WiX checksum mismatch'}
          Expand-Archive tools\mingw.zip tools
          Expand-Archive tools\wix.zip tools\wix
          Remove-Item tools\mingw.zip, tools\wix.zip

      - name: Point the scripts at the tools
        shell: pwsh
        run: |
          "LLVM_MINGW=$PWD\tools\llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64" >> $env:GITHUB_ENV
          "WIX=$PWD\tools\wix" >> $env:GITHUB_ENV

      - name: Build and run offline tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: .\build.ps1 -Test

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: .\package.ps1

      # Code signing through SignPath Foundation. It runs once the repository variables SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN are set; until then releases stay unsigned.
      # SignPath signs the program files inside the MSI and the MSI itself (see .signpath/artifact-configuration.xml);
      # every signing request is approved by hand in SignPath.
      - name: Read the version
        id: ver
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          "version=$((Get-Content .\version.txt -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer for signing
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/*.msi

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ steps.ver.outputs.version }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed installer
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          Copy-Item signed\*.msi dist -Force
          $version=(Get-Content .\version.txt -Raw).Trim()
          Get-FileHash dist\*.msi | Select-Object Hash,@{n='File';e={Split-Path $_.Path -Leaf}} | ConvertTo-Json | Set-Content "dist\SHA256-$version.json"

      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*

  release:
    # A tag v1.2.3 makes a draft release with the MSI and its checksum; it is published by hand after a look.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/*.msi dist/SHA256-*.json --draft --title "Pixie Privacy Pro $version" --notes "$notes"
